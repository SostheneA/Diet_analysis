<svg viewBox="0 0 1210 672" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7b"/></marker></defs><rect x="0" y="0" width="1210" height="672" fill="#ffffff"/><text x="605" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">A decision tree for the diagnostic typology</text><text x="605" y="54" text-anchor="middle" font-size="13" fill="#5a6b7b"></text><rect x="420" y="78" width="370" height="46" rx="8" fill="#fff" stroke="#34495e" stroke-width="1.5"/><text x="605" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2c3e50">Stratum eligible at this resolution?</text><text x="605" y="114" text-anchor="middle" font-size="11" fill="#5a6b7b">at least N_MIN = 5 valid stomachs in both periods</text><rect x="910" y="80" width="200" height="44" rx="8" fill="#E4E7EA" stroke="#9AA6B0" stroke-width="1.3"/><text x="1010" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4B5563">Inconclusive</text><text x="1010" y="115" text-anchor="middle" font-size="9.5" fill="#6b7785">coverage flag — outside the families</text><line x1="790" y1="102" x2="906" y2="102" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="846" y="96" text-anchor="middle" font-size="10" fill="#5a6b7b">no</text><line x1="605" y1="124" x2="605" y2="148" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="617" y="140" font-size="10" fill="#5a6b7b">yes</text><rect x="440" y="150" width="330" height="56" rx="8" fill="#fff" stroke="#34495e" stroke-width="1.6"/><text x="605" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">Q1 · Prey composition changed?</text><text x="605" y="190" text-anchor="middle" font-size="10.5" fill="#5a6b7b">PERMANOVA — Bray–Curtis (biomass and occurrence)</text><line x1="470" y1="206" x2="292" y2="318" stroke="#2E7D32" stroke-width="1.6" marker-end="url(#arrow)"/><text x="300" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#2E7D32">composition unchanged  (p &gt; 0.10)</text><line x1="740" y1="206" x2="917" y2="318" stroke="#C0392B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="910" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#C0392B">composition changed  (p ≤ 0.05)</text><line x1="605" y1="206" x2="605" y2="248" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="612" y="230" font-size="9.5" fill="#5a6b7b">trend</text><rect x="540" y="250" width="130" height="58" rx="8" fill="#1F3B4D" stroke="#142A38" stroke-width="1.3"/><text x="605" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Emerging Shift</text><text x="605" y="287" text-anchor="middle" font-size="8.5" fill="#DCE7EC">comp. trend only (0.05&lt;p≤0.10)</text><text x="605" y="299" text-anchor="middle" font-size="8.5" fill="#DCE7EC">→ folded into Stability</text><rect x="60" y="320" width="465" height="256" rx="10" fill="#F5F8F5" stroke="#2E7D32" stroke-width="1.2"/><text x="292" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">Composition UNCHANGED — same prey identities</text><rect x="685" y="320" width="465" height="256" rx="10" fill="#FBF4F3" stroke="#C0392B" stroke-width="1.2"/><text x="917" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">Composition CHANGED — prey turnover</text><rect x="72" y="356" width="215" height="92" rx="8" fill="#1F3B4D" stroke="#142A38" stroke-width="1.5"/><text x="179.5" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Stability</text><text x="179.5" y="406" text-anchor="middle" font-size="9" fill="#FFFFFF">no turnover, no functional change</text><g font-size="9" font-weight="700"><rect x="80" y="420" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="112.0" y="432" text-anchor="middle" fill="#607080">Comp ns</text><rect x="150" y="420" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="182.0" y="432" text-anchor="middle" fill="#607080">H' ns</text><rect x="220" y="420" width="59" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="249.5" y="432" text-anchor="middle" fill="#607080">Bs ns</text></g><rect x="298" y="356" width="215" height="92" rx="8" fill="#9CB7C5" stroke="#5E8090" stroke-width="1.5"/><text x="405.5" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#16242B">Functional change</text><text x="405.5" y="406" text-anchor="middle" font-size="9" fill="#16242B">same prey list; diversity</text><text x="405.5" y="417" text-anchor="middle" font-size="9" fill="#16242B">re-weighted</text><g font-size="9" font-weight="700"><rect x="306" y="420" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="338.0" y="432" text-anchor="middle" fill="#607080">Comp ns</text><rect x="376" y="420" width="64" height="18" rx="4" fill="#DCE7EC" stroke="#5E8090"/><text x="408.0" y="432" text-anchor="middle" fill="#1F3B4D">H' sig</text><rect x="446" y="420" width="59" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="475.5" y="432" text-anchor="middle" fill="#607080">Bs ns</text></g><rect x="72" y="468" width="215" height="92" rx="8" fill="#9CB7C5" stroke="#5E8090" stroke-width="1.5"/><text x="179.5" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#16242B">Functional change</text><text x="179.5" y="518" text-anchor="middle" font-size="9" fill="#16242B">same prey list; niche breadth</text><text x="179.5" y="529" text-anchor="middle" font-size="9" fill="#16242B">shifts</text><g font-size="9" font-weight="700"><rect x="80" y="532" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="112.0" y="544" text-anchor="middle" fill="#607080">Comp ns</text><rect x="150" y="532" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="182.0" y="544" text-anchor="middle" fill="#607080">H' ns</text><rect x="220" y="532" width="59" height="18" rx="4" fill="#DCE7EC" stroke="#5E8090"/><text x="249.5" y="544" text-anchor="middle" fill="#1F3B4D">Bs sig</text></g><rect x="298" y="468" width="215" height="92" rx="8" fill="#9CB7C5" stroke="#5E8090" stroke-width="1.5"/><text x="405.5" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#16242B">Functional change</text><text x="405.5" y="518" text-anchor="middle" font-size="9" fill="#16242B">same prey list; diversity and</text><text x="405.5" y="529" text-anchor="middle" font-size="9" fill="#16242B">breadth shift</text><g font-size="9" font-weight="700"><rect x="306" y="532" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="338.0" y="544" text-anchor="middle" fill="#607080">Comp ns</text><rect x="376" y="532" width="64" height="18" rx="4" fill="#DCE7EC" stroke="#5E8090"/><text x="408.0" y="544" text-anchor="middle" fill="#1F3B4D">H' sig</text><rect x="446" y="532" width="59" height="18" rx="4" fill="#DCE7EC" stroke="#5E8090"/><text x="475.5" y="544" text-anchor="middle" fill="#1F3B4D">Bs sig</text></g><rect x="697" y="356" width="215" height="92" rx="8" fill="#E2742A" stroke="#B95A1C" stroke-width="1.5"/><text x="804.5" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#3A1D06">Substitution</text><text x="804.5" y="406" text-anchor="middle" font-size="9" fill="#3A1D06">like-for-like turnover; diversity</text><text x="804.5" y="417" text-anchor="middle" font-size="9" fill="#3A1D06">and breadth hold</text><g font-size="9" font-weight="700"><rect x="705" y="420" width="64" height="18" rx="4" fill="#F6D8BF" stroke="#B95A1C"/><text x="737.0" y="432" text-anchor="middle" fill="#8A3D12">Comp sig</text><rect x="775" y="420" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="807.0" y="432" text-anchor="middle" fill="#607080">H' ns</text><rect x="845" y="420" width="59" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="874.5" y="432" text-anchor="middle" fill="#607080">Bs ns</text></g><rect x="923" y="356" width="215" height="92" rx="8" fill="#9D2B25" stroke="#6F1712" stroke-width="1.5"/><text x="1030.5" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Reorganisation</text><text x="1030.5" y="406" text-anchor="middle" font-size="9" fill="#FFFFFF">turnover + diversity change</text><g font-size="9" font-weight="700"><rect x="931" y="420" width="64" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="963.0" y="432" text-anchor="middle" fill="#7E2018">Comp sig</text><rect x="1001" y="420" width="64" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="1033.0" y="432" text-anchor="middle" fill="#7E2018">H' sig</text><rect x="1071" y="420" width="59" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="1100.5" y="432" text-anchor="middle" fill="#607080">Bs ns</text></g><rect x="697" y="468" width="215" height="92" rx="8" fill="#9D2B25" stroke="#6F1712" stroke-width="1.5"/><text x="804.5" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Reorganisation</text><text x="804.5" y="518" text-anchor="middle" font-size="9" fill="#FFFFFF">turnover + breadth change</text><g font-size="9" font-weight="700"><rect x="705" y="532" width="64" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="737.0" y="544" text-anchor="middle" fill="#7E2018">Comp sig</text><rect x="775" y="532" width="64" height="18" rx="4" fill="#ECEFF1" stroke="#B0BAC2"/><text x="807.0" y="544" text-anchor="middle" fill="#607080">H' ns</text><rect x="845" y="532" width="59" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="874.5" y="544" text-anchor="middle" fill="#7E2018">Bs sig</text></g><rect x="923" y="468" width="215" height="92" rx="8" fill="#9D2B25" stroke="#6F1712" stroke-width="1.5"/><text x="1030.5" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Reorganisation</text><text x="1030.5" y="518" text-anchor="middle" font-size="9" fill="#FFFFFF">turnover + diversity and breadth</text><text x="1030.5" y="529" text-anchor="middle" font-size="9" fill="#FFFFFF">change</text><g font-size="9" font-weight="700"><rect x="931" y="532" width="64" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="963.0" y="544" text-anchor="middle" fill="#7E2018">Comp sig</text><rect x="1001" y="532" width="64" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="1033.0" y="544" text-anchor="middle" fill="#7E2018">H' sig</text><rect x="1071" y="532" width="59" height="18" rx="4" fill="#ECC4C0" stroke="#6F1712"/><text x="1100.5" y="544" text-anchor="middle" fill="#7E2018">Bs sig</text></g><line x1="60" y1="592" x2="1150" y2="592" stroke="#d6dde3" stroke-width="1"/><g font-size="11"><rect x="62" y="602" width="14" height="14" rx="3" fill="#1F3B4D" stroke="#142A38"/><text x="82" y="613" fill="#37474F">Stability (incl. Emerging)</text><rect x="290" y="602" width="14" height="14" rx="3" fill="#E2742A" stroke="#B95A1C"/><text x="310" y="613" fill="#37474F">Substitution — like-for-like turnover</text><rect x="645" y="602" width="14" height="14" rx="3" fill="#9CB7C5" stroke="#5E8090"/><text x="665" y="613" fill="#37474F">Functional change (same prey)</text><rect x="905" y="602" width="14" height="14" rx="3" fill="#9D2B25" stroke="#6F1712"/><text x="925" y="613" fill="#37474F">Reorganisation — multi-axis</text><rect x="62" y="626" width="14" height="14" rx="3" fill="#E4E7EA" stroke="#9AA6B0"/><text x="82" y="637" fill="#37474F">Inconclusive</text><text x="300" y="637" fill="#5a6b7b">Chips = the three signals (Comp / H' / Bs):  sig = significant change,  ns = no change.</text></g><text x="62" y="660" font-size="11" font-style="italic" fill="#5a6b7b"></text></svg>